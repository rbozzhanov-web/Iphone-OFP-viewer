name: Android app

# Builds OFP Viewer for Android and publishes an APK to install straight onto the
# phone (Settings → allow installs from this source, then tap the file).
#
# Every build is signed with the same key (android/app/sideload.keystore), so
# each new APK installs over the last one and keeps the open plan and settings.
#
# Where the APK ends up:
#   - every push that touches the app: an artifact on the run, kept 90 days;
#   - a push to main: the "android-latest" release, replaced each time, so one
#     link always gives the newest build;
#   - a v* tag, or running this by hand with a version: attached to that release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths:
      - "android/**"
      - "index.html"
      - "icon-192.png"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Version to publish, e.g. v1.0.0. Leave empty to only build."
        required: false
        default: ""

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Android counts versions by a number that must only ever go up for an
      # update to install over the last build; the run number does that.
      - name: Version
        env:
          RELEASE: ${{ inputs.release }}
          RUN: ${{ github.run_number }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}";
          elif [ -n "$RELEASE" ]; then name="${RELEASE#v}";
          else name="1.0.$RUN"; fi
          echo "VERSION_CODE=$RUN" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$name" >> "$GITHUB_ENV"
          echo "versionName $name, versionCode $RUN"

      - name: Build and lint
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease lintRelease

      - name: Lint report
        if: always()
        run: |
          f=android/app/build/reports/lint-results-release.txt
          if [ -f "$f" ]; then { echo '## Lint'; echo '```'; tail -n 60 "$f"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"; fi

      # The one thing worth checking that a compiler cannot: that the reader in
      # the app is the one in this commit.
      - name: The reader is in the APK
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          a=$(sha256sum index.html | cut -d' ' -f1)
          b=$(unzip -p "$apk" assets/web/index.html | sha256sum | cut -d' ' -f1)
          echo "repository $a"; echo "apk        $b"
          test "$a" = "$b"
          cp "$apk" "$RUNNER_TEMP/OFP-Viewer.apk"
          ls -lh "$RUNNER_TEMP/OFP-Viewer.apk"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: OFP-Viewer-apk
          path: ${{ runner.temp }}/OFP-Viewer.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publish android-latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create android-latest "$RUNNER_TEMP/OFP-Viewer.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "OFP Viewer for Android — latest ($VERSION_NAME)" \
            --notes-file .github/release-notes-android.md

      # A v* tag may already have its release from the iOS build; the APK joins it.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.release || github.ref_name }}
        run: |
          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$VERSION" "$RUNNER_TEMP/OFP-Viewer.apk" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$VERSION" "$RUNNER_TEMP/OFP-Viewer.apk" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "OFP Viewer $VERSION" \
              --notes-file .github/release-notes-android.md
          fi
